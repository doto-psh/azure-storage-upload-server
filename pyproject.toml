[project]
name = "azure-script"
version = "0.1.0"
description = "Issue short-lived Azure Blob SAS URLs and upload files through a Python CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.25.1",
    "azure-storage-blob>=12.27.1",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "typer>=0.20.0",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
azure-upload = "azure_script.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
